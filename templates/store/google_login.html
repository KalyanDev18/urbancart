{% extends 'store/base.html' %}

{% block title %}Sign in with Google | UrbanCart{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-amber-200/90 shadow-xl text-center">
        
        <!-- Google Logo Header -->
        <div class="w-16 h-16 rounded-2xl bg-white border border-stone-200 flex items-center justify-center mx-auto mb-4 shadow-md">
            <svg class="w-10 h-10" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
        </div>

        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Sign in with Google</h2>
        <p class="text-sm text-slate-500 mt-1 mb-6">Enter your Gmail address for instant 1-click Google authentication</p>

        <!-- Gmail Authentication Form -->
        <form action="{% url 'google_login' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="text-left">
                <label for="gmail" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Gmail Address</label>
                <div class="relative">
                    <input type="email" name="gmail" id="gmail" required placeholder="kalyan@gmail.com" autofocus
                           class="w-full bg-stone-50 border border-amber-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white focus:ring-2 focus:ring-amber-200 transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                <span>Continue to UrbanCart</span>
                <span>&rarr;</span>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-stone-100 text-xs text-slate-400">
            Protected by Google OAuth 2.0 security protocols.
        </div>
    </div>
</div>
{% endblock %}
